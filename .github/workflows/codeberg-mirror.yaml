name: Mirroring

on: [push, delete]

jobs:
  to_codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@674e65a7d483ca28dafaacba0d07351bdcc8bd75 # v1.1.1
        with:
          target_repo_url:
            git@codeberg.org:danvratil/qcoro.git
          ssh_private_key:
            ${{ secrets.CODEBERG_MIRROR_SSH_PRIVATE_KEY }}

